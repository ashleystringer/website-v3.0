name: Running Prettier
on:
    pull_request:
    push:
permissions: 
    contents: write
jobs:
    prettier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'
            - name: Install dependencies
              run: npm ci --frozen-lockfile
            - name: Run Prettier
              run: | 
                npm run prettier
